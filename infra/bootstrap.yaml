AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Gatekeeper bootstrap resources: private ECR repositories for the gateway and
  mock-backend container images. Image storage and image-publishing permissions
  are configured separately to keep each stack narrowly scoped.

Resources:
  GatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: gatekeeper
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: gatekeeper

  MockBackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: gatekeeper-mock-backend
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 20 newest images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: gatekeeper

Outputs:
  GatewayRepositoryName:
    Description: Repository variable ECR_GATEWAY_REPOSITORY.
    Value: !Ref GatewayRepository

  MockBackendRepositoryName:
    Description: Repository variable ECR_MOCK_REPOSITORY.
    Value: !Ref MockBackendRepository

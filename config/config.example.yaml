server:
  address: ":8080"
  read_header_timeout: "5s"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"

redis:
  address: "redis:6379"
  database: 0
  operation_timeout: "100ms"
  failure_policy: "fail_open"

backends:
  mock:
    url: "http://localhost:8081"

routes:
  - name: "search"
    method: "GET"
    path_prefix: "/api/search"
    backend: "mock"
    limit:
      capacity: 50
      refill:
        tokens: 50
        interval: "1m"
    client_overrides:
      demo-premium-client:
        capacity: 100
        refill:
          tokens: 100
          interval: "1m"

  - name: "upload"
    method: "POST"
    path_prefix: "/api/upload"
    backend: "mock"
    limit:
      capacity: 5
      refill:
        tokens: 5
        interval: "1m"

server:
  address: ":8080"
  read_header_timeout: "5s"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"

redis:
  # ECS replaces this placeholder with the ElastiCache endpoint by environment
  # variable after CloudFormation creates the cache.
  address: "set-by-GATEKEEPER_REDIS_ADDRESS:6379"
  tls: true
  database: 0
  operation_timeout: "250ms"
  failure_policy: "fail_open"

backends:
  # The mock backend is a sidecar in the same ECS task, so both containers share
  # the task's loopback network interface.
  mock:
    url: "http://127.0.0.1:8081"

routes:
  - name: "search"
    method: "GET"
    path_prefix: "/api/search"
    backend: "mock"
    limit:
      capacity: 50
      refill:
        tokens: 50
        interval: "1m"
    client_overrides:
      demo-premium-client:
        capacity: 100
        refill:
          tokens: 100
          interval: "1m"

  - name: "upload"
    method: "POST"
    path_prefix: "/api/upload"
    backend: "mock"
    limit:
      capacity: 5
      refill:
        tokens: 5
        interval: "1m"
